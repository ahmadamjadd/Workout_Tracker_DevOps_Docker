services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workout_db
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. Backend (FastAPI)
  backend:
    build: ./backend
    # This ensures the backend keeps retrying until the DB is ready
    restart: on-failure
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workout_db
      POSTGRES_HOST: db
    ports:
      - "8001:8000"
    depends_on:
      - db

  # 3. Frontend (React on Apache)
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8001/workouts/
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data: